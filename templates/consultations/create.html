{% extends 'base.html' %}

{% block title %}Nueva Consulta - MedInsight Hospital{% endblock %}

{% block content %}
<div class="container-fluid">
    <h1 class="section-title"><i class="fas fa-plus-circle"></i> Nueva Consulta</h1>
    
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Paciente *</label>
                            <select name="id_paciente" class="form-select" required>
                                <option value="">Seleccionar</option>
                                {% for patient in patients %}
                                <option value="{{ patient.id_paciente }}">{{ patient.nombre }} {{ patient.apellido }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Médico *</label>
                            <select name="id_medico" class="form-select" required>
                                <option value="">Seleccionar</option>
                                {% for doctor in doctors %}
                                <option value="{{ doctor.id_medico }}">{{ doctor.nombre }} {{ doctor.apellido }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label">Tipo de Consulta</label>
                            <select name="tipo_consulta" class="form-select">
                                <option value="Consulta">Consulta</option>
                                <option value="Primera vez">Primera vez</option>
                                <option value="Seguimiento">Seguimiento</option>
                                <option value="Urgencia">Urgencia</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label">Duración (minutos)</label>
                            <input type="number" name="duracion_atencion" class="form-control" value="30">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label">Temperatura (°C)</label>
                            <input type="number" name="temperatura" class="form-control" step="0.1" value="36.5">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="mb-3">
                            <label class="form-label">Peso (kg)</label>
                            <input type="number" name="peso" class="form-control" step="0.1">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="mb-3">
                            <label class="form-label">Altura (cm)</label>
                            <input type="number" name="altura" class="form-control" step="0.1">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="mb-3">
                            <label class="form-label">Presión Arterial</label>
                            <input type="text" name="presion_arterial" class="form-control" placeholder="120/80">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="mb-3">
                            <label class="form-label">Frecuencia Cardíaca</label>
                            <input type="number" name="frecuencia_cardiaca" class="form-control">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Síntomas</label>
                            <textarea name="sintomas" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Notas Clínicas</label>
                            <textarea name="notas_clinicas" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                </div>
                
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Registrar Consulta
                    </button>
                    <a href="{% url 'consultations:list' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
