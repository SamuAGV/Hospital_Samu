{% extends 'base.html' %}

{% block title %}Editar Paciente - MedInsight Hospital{% endblock %}

{% block content %}
<div class="container-fluid">
    <h1 class="section-title"><i class="fas fa-user-edit"></i> Editar Paciente</h1>
    
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Nombre *</label>
                            <input type="text" name="nombre" class="form-control" value="{{ patient.nombre }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Apellido *</label>
                            <input type="text" name="apellido" class="form-control" value="{{ patient.apellido }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Fecha de Nacimiento *</label>
                            <input type="date" name="fecha_nacimiento" class="form-control" value="{{ patient.fecha_nacimiento }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Género</label>
                            <select name="genero" class="form-select">
                                <option value="">Seleccionar</option>
                                <option value="Masculino" {% if patient.genero == 'Masculino' %}selected{% endif %}>Masculino</option>
                                <option value="Femenino" {% if patient.genero == 'Femenino' %}selected{% endif %}>Femenino</option>
                                <option value="Otro" {% if patient.genero == 'Otro' %}selected{% endif %}>Otro</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" name="telefono" class="form-control" value="{{ patient.telefono }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ patient.email }}">
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <textarea name="direccion" class="form-control" rows="2">{{ patient.direccion }}</textarea>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label">Tipo de Sangre</label>
                            <select name="tipo_sangre" class="form-select">
                                <option value="">Seleccionar</option>
                                <option value="A+" {% if patient.tipo_sangre == 'A+' %}selected{% endif %}>A+</option>
                                <option value="A-" {% if patient.tipo_sangre == 'A-' %}selected{% endif %}>A-</option>
                                <option value="B+" {% if patient.tipo_sangre == 'B+' %}selected{% endif %}>B+</option>
                                <option value="B-" {% if patient.tipo_sangre == 'B-' %}selected{% endif %}>B-</option>
                                <option value="AB+" {% if patient.tipo_sangre == 'AB+' %}selected{% endif %}>AB+</option>
                                <option value="AB-" {% if patient.tipo_sangre == 'AB-' %}selected{% endif %}>AB-</option>
                                <option value="O+" {% if patient.tipo_sangre == 'O+' %}selected{% endif %}>O+</option>
                                <option value="O-" {% if patient.tipo_sangre == 'O-' %}selected{% endif %}>O-</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label">Alergias</label>
                            <input type="text" name="alergias" class="form-control" value="{{ patient.alergias }}">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label">Enfermedades Crónicas</label>
                            <input type="text" name="enfermedades_cronicas" class="form-control" value="{{ patient.enfermedades_cronicas }}">
                        </div>
                    </div>
                </div>
                
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Actualizar Paciente
                    </button>
                    <a href="{% url 'patients:detail' patient.id %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
