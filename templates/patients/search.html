{% extends 'patients/list.html' %}

{% block title %}Buscar Pacientes - MedInsight Hospital{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="section-title mb-0">
            <i class="fas fa-search"></i> Resultados de búsqueda: "{{ query }}"
        </h1>
        <a href="{% url 'patients:list' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </div>
    
    <p class="text-muted">Se encontraron {{ total|default:0 }} pacientes</p>
    
    {{ block.super }}
</div>
{% endblock %}
